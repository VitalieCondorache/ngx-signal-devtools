name: Demo (GitHub Pages)

# Requires Pages to be enabled first (Settings -> Pages -> Source: GitHub Actions).
# Deploys the showcase app on every push to main; can also be run manually from the Actions tab.
on:
  push:
    branches: [main]
    paths:
      - 'apps/demo/**'
      - 'projects/**'
      - 'angular.json'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build the library
        run: npm run build:lib

      - name: Build the demo for a project page
        run: npx ng build demo --base-href "/${{ github.event.repository.name }}/"

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/demo/browser

      - id: deployment
        uses: actions/deploy-pages@v4
