name: Feature request
description: Suggest a capability, a diagnostic or a UI improvement
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem are you trying to solve?
      description: Describe the situation in your app, not the API you would like.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: checkboxes
    id: constraints
    attributes:
      label: Constraints
      options:
        - label: It can stay free of runtime dependencies
        - label: It must not add cost to production builds
        - label: It can live behind a configuration flag
