name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: lint, test and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify the private signal graph contract
        run: npm run probe:internals

      - name: Lint
        run: npm run lint

      - name: Prettier
        run: npm run format:check

      - name: Test the library with coverage
        run: npm run test:lib

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage
          if-no-files-found: ignore

      - name: Build the library
        run: npm run build:lib

      - name: Build the showcase app
        run: npm run build:demo

      - name: Inspect the published artefact
        run: cd dist/vitalie27dev/ngx-signal-devtools && npm pack --dry-run

  smoke:
    name: browser smoke test on the production build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Build the library
        run: npm run build:lib

      - name: Build the showcase app
        run: npm run build:demo

      # Unit tests use manual change detection and can therefore never catch a devtool that keeps the
      # scheduler spinning — only a real browser booting the optimised bundle can.
      - name: Boot the demo in a real browser
        run: npm run e2e

      - name: Upload screenshots on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-failure
          path: test-results
          if-no-files-found: ignore
