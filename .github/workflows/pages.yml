name: Demo (GitHub Pages)

# Runs manually on purpose: enable Pages first (Settings -> Pages -> Source: GitHub Actions),
# then run this workflow from the Actions tab. Uncomment the `push` trigger afterwards to deploy
# the demo on every push to main.
on:
  workflow_dispatch:
  # push:
  #   branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build the library
        run: npm run build:lib

      - name: Build the demo for a project page
        run: npx ng build demo --base-href "/${{ github.event.repository.name }}/"

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/demo/browser

      - id: deployment
        uses: actions/deploy-pages@v4
