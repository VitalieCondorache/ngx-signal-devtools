      <text x="250" y="147" fill="#9aa3b8">computed</text>
      <text x="318" y="147" fill="#6f7890">todos.store.ts:41</text>
      <text x="520" y="147" fill="#9aa3b8" text-anchor="end">96</text>
      <text x="590" y="147" fill="#9aa3b8" text-anchor="end">0</text>
      <text x="676" y="147" fill="#9aa3b8" text-anchor="end">118</text>
      <text x="750" y="147" fill="#9aa3b8" text-anchor="end">2</text>
      <text x="890" y="147" fill="#9aa3b8" text-anchor="end">1</text>

      <line x1="10" y1="188" x2="910" y2="188" stroke="#1d2230" />
      <text x="24" y="177" fill="#c4b5fd">expensiveScore</text>
      <text x="250" y="177" fill="#9aa3b8">computed</text>
      <text x="318" y="177" fill="#6f7890">todos.store.ts:78</text>
      <text x="520" y="177" fill="#9aa3b8" text-anchor="end">4</text>
      <text x="590" y="177" fill="#9aa3b8" text-anchor="end">0</text>
      <text x="676" y="177" fill="#9aa3b8" text-anchor="end">4</text>
      <text x="750" y="177" fill="#9aa3b8" text-anchor="end">1</text>
      <text x="890" y="177" fill="#9aa3b8" text-anchor="end">0</text>

      <line x1="10" y1="218" x2="910" y2="218" stroke="#1d2230" />
      <text x="24" y="207" fill="#7dd3fc">widgetTicks</text>
      <text x="250" y="207" fill="#9aa3b8">signal</text>
      <text x="318" y="207" fill="#6f7890">leaky-widget.ts:48</text>
      <text x="520" y="207" fill="#9aa3b8" text-anchor="end">61</text>
      <text x="590" y="207" fill="#fca5a5" text-anchor="end">61</text>
      <text x="676" y="207" fill="#9aa3b8" text-anchor="end">0</text>
      <text x="750" y="207" fill="#9aa3b8" text-anchor="end">-</text>
      <text x="890" y="207" fill="#9aa3b8" text-anchor="end">1</text>

      <line x1="10" y1="248" x2="910" y2="248" stroke="#1d2230" />
      <text x="24" y="237" fill="#fdba74">persistTodos</text>
      <text x="250" y="237" fill="#9aa3b8">effect</text>
      <text x="318" y="237" fill="#6f7890">todos.store.ts:52</text>
      <text x="520" y="237" fill="#9aa3b8" text-anchor="end">0</text>
      <text x="590" y="237" fill="#9aa3b8" text-anchor="end">0</text>
      <text x="676" y="237" fill="#9aa3b8" text-anchor="end">0</text>
      <text x="750" y="237" fill="#9aa3b8" text-anchor="end">-</text>
      <text x="890" y="237" fill="#9aa3b8" text-anchor="end">1 run</text>
    </g>
    <!-- detail footer -->
    <rect x="10" y="330" width="900" height="90" fill="#141826" />
    <line x1="10" y1="330" x2="910" y2="330" stroke="#262b3a" />
    <text x="24" y="352" fill="#d7dbe7" font-size="11" font-weight="700">widgetTicks</text>
    <rect x="98" y="343" width="52" height="15" rx="7" fill="#232838" stroke="#313749" />
    <text x="110" y="354" fill="#a9b2c7" font-size="9">signal</text>
    <rect x="158" y="343" width="120" height="15" rx="7" fill="#3a1f22" stroke="#6b2b30" />
    <text x="166" y="354" fill="#ffb4b4" font-size="9">written after destroy</text>
    <text x="290" y="354" fill="#6f7890" font-size="10">owner: LeakyWidget</text>
    <text x="890" y="354" fill="#6f7890" font-size="10" text-anchor="end">apps/demo/src/app/showcase/leaky-widget.ts</text>

    <text x="24" y="378" fill="#6f7890" font-size="10">deps (none):</text>
    <text x="118" y="378" fill="#6f7890" font-size="10">none</text>
    <text x="480" y="378" fill="#6f7890" font-size="10">consumers:</text>
    <text x="556" y="378" fill="#6f7890" font-size="10">1 + 0 view</text>

    <text x="24" y="402" fill="#6f7890" font-size="10">reads 61 · writes 61 (0 no-op) · recomputes 0 · runs 0 · last n/a</text>
    <rect x="470" y="391" width="222" height="16" rx="8" fill="#3a1f22" stroke="#6b2b30" />
    <text x="480" y="403" fill="#ffb4b4" font-size="10">after destroy: 0 reads / 61 writes</text>
  </g>
</svg>
