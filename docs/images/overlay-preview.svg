<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 430" width="920" height="430" role="img" aria-label="The devtools overlay: signals table">
  <!-- panel -->
  <rect x="10" y="10" width="900" height="410" rx="12" fill="#12141c" stroke="#2a2f3f" />
  <rect x="10" y="10" width="900" height="34" rx="12" fill="#1c2030" />
  <rect x="10" y="30" width="900" height="14" fill="#1c2030" />
  <line x1="10" y1="44" x2="910" y2="44" stroke="#2a2f3f" />

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
    <!-- header -->
    <polygon points="26,32 31,27 36,32 31,37" fill="#7dd3fc" />
    <text x="44" y="33" fill="#d7dbe7" font-size="12" font-weight="700">ngx-signal-devtools</text>
    <text x="190" y="33" fill="#8b93a7" font-size="11">14 tracked</text>
    <text x="262" y="33" fill="#8b93a7" font-size="11">12 live</text>
    <text x="316" y="33" fill="#8b93a7" font-size="11">1238 computed</text>
    <text x="414" y="33" fill="#8b93a7" font-size="11">9410 reads</text>
    <text x="490" y="33" fill="#8b93a7" font-size="11">312 writes</text>

    <rect x="600" y="21" width="46" height="18" rx="9" fill="#3a1f22" stroke="#6b2b30" />
    <polygon points="610,25 616,35 604,35" fill="#ffb4b4" />
    <text x="613" y="34" fill="#ffb4b4" font-size="10">!</text>
    <text x="626" y="34" fill="#ffb4b4" font-size="11">3</text>
    <text x="660" y="34" fill="#9aa3b8" font-size="11">pause · clear · export · close</text>

    <!-- tabs -->
    <rect x="10" y="44" width="900" height="30" fill="#151824" />
    <line x1="10" y1="74" x2="910" y2="74" stroke="#262b3a" />
    <rect x="20" y="50" width="104" height="20" rx="6" fill="#222839" stroke="#384156" />
    <text x="32" y="64" fill="#e8ecf7" font-size="11">Signals 14</text>
    <text x="140" y="64" fill="#98a1b6" font-size="11">Events</text>
    <text x="204" y="64" fill="#98a1b6" font-size="11">Warnings</text>
    <text x="284" y="64" fill="#98a1b6" font-size="11">Graph</text>

    <!-- table header -->
    <rect x="10" y="74" width="900" height="24" fill="#161a26" />
    <text x="24" y="90" fill="#7f889d" font-size="10">name</text>
    <text x="250" y="90" fill="#7f889d" font-size="10">kind</text>
    <text x="318" y="90" fill="#7f889d" font-size="10">where</text>
    <text x="520" y="90" fill="#7f889d" font-size="10" text-anchor="end">reads</text>
    <text x="590" y="90" fill="#7f889d" font-size="10" text-anchor="end">writes</text>
    <text x="676" y="90" fill="#7f889d" font-size="10" text-anchor="end">recomp.</text>
    <text x="750" y="90" fill="#7f889d" font-size="10" text-anchor="end">deps</text>
    <text x="890" y="90" fill="#7f889d" font-size="10" text-anchor="end">consumers</text>

    <!-- rows -->
    <g font-size="11">
      <line x1="10" y1="126" x2="910" y2="126" stroke="#1d2230" />
      <text x="24" y="112" fill="#7dd3fc">todos</text>
      <text x="24" y="122" fill="#6f7890" font-size="9">[{id:1,title:"Ship 0.1.0",done:false}]</text>
      <text x="250" y="112" fill="#9aa3b8">signal</text>
      <text x="318" y="112" fill="#6f7890">todos.store.ts:31</text>
      <text x="520" y="112" fill="#9aa3b8" text-anchor="end">412</text>
      <text x="590" y="112" fill="#9aa3b8" text-anchor="end">37</text>
      <text x="676" y="112" fill="#9aa3b8" text-anchor="end">0</text>
      <text x="750" y="112" fill="#9aa3b8" text-anchor="end">-</text>
      <text x="890" y="112" fill="#9aa3b8" text-anchor="end">1 +2 view</text>

      <rect x="10" y="128" width="900" height="30" fill="#202839" />
      <line x1="10" y1="158" x2="910" y2="158" stroke="#1d2230" />
